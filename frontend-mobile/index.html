<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0E0E1A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OLAI &bull; Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="m.css">
</head>

<body>
    <header class="mtop">
        <div class="mbrand">
            <span class="mlogo"><i class="fa-solid fa-scroll"></i></span>
            <span class="mbrand-txt">OLAI <b class="tamil">ஓலை</b></span>
        </div>
        <div class="mtop-right">
            <span class="mdot off" id="m-engine-dot" title="Connecting"></span>
        </div>
    </header>

    <main class="mmain">

        <!-- ================= SCAN ================= -->
        <section class="mview active" id="view-scan">
            <div class="mhero">
                <div class="mhero-h">Digitize a Tamil page</div>
                <div class="mhero-sub tamil">தமிழ் ஆவணங்களை எண்ணிமமாக்குதல்</div>

                <div class="mcapture" style="margin-top: 14px;">
                    <button class="mbig-btn gold" id="m-camera-launch" type="button">
                        <i class="fa-solid fa-camera"></i><span>Scan with camera</span>
                    </button>
                    <label class="m-camera-fallback" for="m-camera-upload">Camera unavailable? Choose a photo.</label>
                    <input id="m-camera-upload" type="file" accept="image/*" capture="environment" hidden>
                    <label class="mbig-btn ghost" for="m-document-upload">
                        <i class="fa-solid fa-file-arrow-up"></i><span>Upload document</span>
                        <input id="m-document-upload" type="file" accept="image/*" hidden>
                    </label>
                    <div class="mrecent-empty" id="m-upload-status" style="text-align: center;" hidden></div>
                </div>
            </div>

            <div class="msec-h">Recent documents</div>
            <div class="mrecent" id="m-recent">
                <div class="mrecent-empty">Loading&hellip;</div>
            </div>
        </section>

        <!-- ================= STATS ================= -->
        <section class="mview" id="view-stats">
            <div class="mstat-grid" id="m-stat-grid"></div>
            <a class="mnote" href="/?desktop=1">Full review workspace lives on the desktop app
                <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
        </section>
    </main>

    <div class="m-camera-modal" id="m-camera-modal" hidden>
        <div class="m-camera-dialog"><div class="m-camera-head"><strong>Take a photo</strong><button id="m-camera-close" type="button">×</button></div><video id="m-camera-preview" autoplay playsinline muted></video><canvas id="m-camera-canvas" hidden></canvas><div class="m-camera-actions"><button id="m-camera-snap" type="button" class="mbig-btn gold">Capture</button><button id="m-camera-retake" type="button" class="mbig-btn ghost" hidden>Retake</button><button id="m-camera-use" type="button" class="mbig-btn gold" hidden>Use photo</button></div><div id="m-camera-error" class="m-camera-error" hidden></div></div>
    </div>

    <nav class="mnav">
        <button class="mnav-btn active" data-view="scan"><i class="fa-solid fa-camera"></i><span>Scan</span></button>
        <button class="mnav-btn" data-view="stats"><i class="fa-solid fa-chart-simple"></i><span>Stats</span></button>
    </nav>

    <script src="m.js"></script>
</body>

</html>
